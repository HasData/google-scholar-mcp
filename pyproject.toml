[project]
name = "hasdata-google-scholar-mcp"
version = "1.0.0"
description = "MCP server for Google Scholar through HasData's hosted API. 1,000 free credits every month."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp","google-scholar","academic","citations","bibliometrics","research","model-context-protocol","hasdata"]
# mcp is pinned below 2 because mcp-proxy 0.12.0 imports request_ctx, removed in the mcp 2.x SDK.
dependencies = ["mcp-proxy>=0.12.0", "mcp>=1.28.1,<2"]

[project.urls]
Homepage = "https://docs.hasdata.com/apis/google-scholar/scholar"
Repository = "https://github.com/HasData/google-scholar-mcp"

[project.scripts]
hasdata-google-scholar-mcp = "hasdata_google_scholar_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hasdata_google_scholar_mcp"]
